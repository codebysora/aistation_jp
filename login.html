<!DOCTYPE html>
<html class="h-100" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./static/css/bootstrap.min.css">
  <link rel="stylesheet" href="./static/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./static/css/style.css">
  <title>Login - AIStation Dashboard</title>
</head>
<body class="h-100 rd-auth-page">
  <main class="rd-auth-shell">
    <div class="rd-auth-panel">
      <div class="card rounded-0 border-0 p-card__login rd-auth-card">
        <div class="rd-auth-card__header text-white text-center fw-bold bg-primary py-4">
          <h1 class="rd-auth-card__title fs-2 mb-1">AIStation Dashboard</h1>
          <p class="rd-auth-card__subtitle mb-0">Login</p>
        </div>
        <div class="card-body p-5">
          <a href="/auth/google/login" class="rd-auth-oauth-btn js-auth-google">
            <span class="rd-auth-oauth-btn__icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20" focusable="false">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
            </span>
            Sign in with Google
          </a>

          <div class="rd-auth-divider" role="separator" aria-label="or"><span>or</span></div>

          <form id="login-form" action="/login" method="POST" novalidate="novalidate">
            <div class="mb-4">
              <label for="email" class="form-label">Email</label>
              <input class="form-control form-control-lg js-validate-email" id="email" name="email" type="email" value="" required autocomplete="username" placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="c-form-field-password rd-auth-password">
                <input class="form-control form-control-lg" id="password" name="password" type="password" value="" required autocomplete="current-password">
                <button type="button" class="c-form-field-password__toggle js-auth-password-toggle" aria-label="Show password" data-target="#password">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div class="mb-4 text-end">
              <a href="./forgot_password.html" class="rd-auth-inline-link link-fade small">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold border-0 shadow-sm">Login</button>
          </form>
        </div>
      </div>
      <a href="./signup.html" class="rd-auth-footer-link link-fade">Sign Up</a>
    </div>
  </main>

  <script src="./static/js/jquery-3.7.1.min.js"></script>
  <script src="./static/js/bootstrap.bundle.min.js"></script>
  <script src="./static/js/app.js"></script>
</body>
</html>
