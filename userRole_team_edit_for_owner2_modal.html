    <!-- Content -->

      <div class="rd-card">

                data-data='[{"user_id":"c752937e-a181-47c6-9486-36fbc75c02a1","email":"takeshi.miyabe@fixstars.com","team_role":"owner"},{"user_id":"b1dee176-d64f-4d02-8f94-1c2f7c3a3a0d","email":"sato.yuki@fixstars.com","team_role":"member"},{"user_id":"002557bc-fae5-4f1f-94fa-da6856f5828d","email":"tanaka.ken@fixstars.com","team_role":"owner"},{"user_id":"58e97e79-b4d8-489f-be1a-ba55436781ad","email":"suzuki.aoi@fixstars.com","team_role":"member"},{"user_id":"5de3a756-b494-45a2-8389-df7ed02fff9f","email":"yamada.ryo@fixstars.com","team_role":"member"},{"user_id":"bda973a8-b16d-400f-982a-0394166fc46b","email":"nakamura.hana@fixstars.com","team_role":"member"}]'>

                    <th data-sortable="true" data-field="team_role" data-formatter="teamRoleFormatter">Member Role</th>
                    <th data-sortable="true" data-field="email">Email</th>
                    <th data-field="actions">Action</th>
                  </tr>
                </thead>
              </table>
            </div>

            <!-- Add Members -->
            <div class="mb-4 pt-3 border-top">
              <label class="form-label fw-bold mb-3">Add Members</label>
              <input type="email" id="emailInput" class="d-none" multiple>

              <div class="dropdown">
                <div class="d-flex flex-wrap align-items-center gap-2 border py-2 px-3 bg-white p-selected-members" aria-expanded="false">
                  <span class="d-inline-flex align-items-center rounded-pill text-dark c-member-tag">
                    localtest+2@fixstars.com
                    <button type="button" class="btn p-0 d-inline-flex align-items-center justify-content-center ms-1" aria-label="Remove">
                      <i class="bi bi-x-circle text-dark"></i>
                    </button>
                  </span>
                  <span class="d-inline-flex align-items-center rounded-pill text-dark c-member-tag">
                    localtest+3@fixstars.com
                    <button type="button" class="btn p-0 d-inline-flex align-items-center justify-content-center ms-1" aria-label="Remove">
                      <i class="bi bi-x-circle text-dark"></i>
                    </button>
                  </span>
                  <span class="d-inline-flex align-items-center rounded-pill text-dark c-member-tag">
                    localtest+4@fixstars.com

                    </div>
                  </div>
                  <table class="table table-hover table-sm mb-0 w-100 bg-white" id="members-select"
                    data-unique-id="user_id" data-toggle="table"
                    data-search="true"
                    data-data='[{"user_id":"c752937e-a181-47c6-9486-36fbc75c02a1","email":"takeshi.miyabe@fixstars.com","team_role":"owner"},{"user_id":"b1dee176-d64f-4d02-8f94-1c2f7c3a3a0d","email":"sato.yuki@fixstars.com","team_role":"member"},{"user_id":"002557bc-fae5-4f1f-94fa-da6856f5828d","email":"tanaka.ken@fixstars.com","team_role":"owner"},{"user_id":"58e97e79-b4d8-489f-be1a-ba55436781ad","email":"suzuki.aoi@fixstars.com","team_role":"member"},{"user_id":"5de3a756-b494-45a2-8389-df7ed02fff9f","email":"yamada.ryo@fixstars.com","team_role":"member"},{"user_id":"bda973a8-b16d-400f-982a-0394166fc46b","email":"nakamura.hana@fixstars.com","team_role":"member"},{"user_id":"f3bfa63f-baf9-4bbb-9953-257b0e892a5c","email":"admin@fixstars.com"},{"user_id":"fbdb2785-fe08-47c9-9b36-b189fee25430","email":"kobayashi.dai@fixstars.com"},{"user_id":"a1b2c3d4-e5f6-7890-abcd-ef1234567890","email":"watanabe.mei@fixstars.com"},{"user_id":"11111111-2222-3333-4444-555555555555","email":"ito.shun@fixstars.com"}]'>
                    <thead>
                      <tr>
                        <th data-sortable="true" data-field="email">Email</th>
                        <th data-sortable="true" data-field="team_role" data-formatter="teamRoleFormatter">Member Role</th>
                        <th data-field="actions">Action</th>

                  </table>

              </div>

            <!-- Role Selection -->
            <div class="mb-4">

                  <li>
                    <input class="form-check-input ms-0" id="role-member" name="role" type="radio" value="member" checked>
                    <label class="form-check-label ms-1" for="role-member">Member</label>
                  </li>
                  <li>
                    <input class="form-check-input ms-0" id="role-owner" name="role" type="radio" value="owner">
                    <label class="form-check-label ms-1" for="role-owner">Owner</label>

  <script src="./static/js/jquery-3.7.1.min.js"></script>

  <script src="./static/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var selectedMembersArea = document.querySelector('.p-selected-members');
      var dropdownMenu = document.querySelector('.dropdown-menu');
      if (selectedMembersArea && dropdownMenu) {
        selectedMembersArea.addEventListener('click', function(event) {
          var removeBtn = event.target.closest('.c-member-tag button[aria-label="Remove"]');
          if (removeBtn) {
            var tag = removeBtn.closest('.c-member-tag');
            if (tag) tag.remove();
            return;
          }
          dropdownMenu.classList.toggle('show');
          var isExpanded = dropdownMenu.classList.contains('show');
          selectedMembersArea.setAttribute('aria-expanded', isExpanded);
        });
        document.addEventListener('click', function(event) {
          if (!event.target.closest('.dropdown')) {
            dropdownMenu.classList.remove('show');
            selectedMembersArea.setAttribute('aria-expanded', 'false');
          }
        });
      }
    });
  </script>
