<body class="h-100">

  <!-- Header -->
  <header>
    <nav class="navbar navbar-expand-sm rd-navbar" aria-label="Top navigation">
      <a class="navbar-brand" href="./">AIStation Dashboard</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a href="#" class="rd-nav-user">
              <span class="rd-nav-user__badge">Admin</span>
              <i class="bi bi-person-circle" aria-hidden="true"></i> root

          <li class="nav-item">
            <a href="#" class="rd-nav-logout"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Logout</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="d-flex rd-main-container">

    <!-- Sidebar -->
    <nav class="rd-sidebar" aria-label="Main navigation">
      <ul class="nav flex-column m-0">
        <li class="rd-sidebar__section-label">Admin</li>
        <li class="nav-item"><a class="nav-link" href="./keys.html"><i class="bi bi-key" aria-hidden="true"></i> API Keys</a></li>
        <li class="nav-item"><a class="nav-link" href="./teams.html"><i class="bi bi-people" aria-hidden="true"></i> Teams</a></li>
        <li class="nav-item"><a class="nav-link" href="./histories.html"><i class="bi bi-clock-history" aria-hidden="true"></i> Histories</a></li>
        <li><div class="rd-sidebar__separator"></div></li>
        <li class="rd-sidebar__separator-label">Management</li>
        <li class="nav-item"><a class="nav-link" href="./model_settings.html"><i class="bi bi-robot" aria-hidden="true"></i> Model management</a></li>
        <li class="nav-item"><a class="nav-link" href="./team_management.html"><i class="bi bi-diagram-3" aria-hidden="true"></i> Team management</a></li>
        <li class="nav-item"><a class="nav-link active" href="./user_management.html"><i class="bi bi-person" aria-hidden="true"></i> User management</a></li>
        <li class="nav-item"><a class="nav-link" href="./mail_settings.html"><i class="bi bi-envelope" aria-hidden="true"></i> Mail settings</a></li>
      </ul>
    </nav>

    <!-- Content -->
    <main class="rd-content bg-body">
      <div class="rd-card">
        <div class="rd-card__header">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="./user_management.html">User management</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">User Edit</li>
            </ol>
          </nav>
        </div>
        <div class="rd-card__body--padded rd-card__body--form">

          <!-- Role form -->
          <form action="/user/edit" method="POST" novalidate="novalidate">
            <input id="csrf_token" name="csrf_token" type="hidden" value="">
            <input type="hidden" name="user_id" value="c752937e-a181-47c6-9486-36fbc75c02a1">

            <div class="mb-3">
              <label class="form-label fw-bold">
                <i class="bi bi-person-circle me-1"></i> takeshi.miyabe@fixstars.com
              </label>
            </div>

            <div class="rd-role-section mb-3">
              <div class="d-flex flex-wrap align-items-center gap-4">
                <label class="form-label mb-0 fw-bold rd-role-section__label">User Role</label>
                <div class="d-flex align-items-center gap-4">
                  <div class="bg-white border rounded-2 d-flex align-items-center gap-4 px-3 py-2">
                    <div class="form-check form-check-inline m-0 ps-0">
                      <input class="form-check-input c-radio-black ms-0" type="radio" name="role" id="role-0" value="user" checked>
                      <label class="form-check-label ms-1" for="role-0">user</label>
                    </div>
                    <div class="form-check form-check-inline m-0 ps-0">
                      <input class="form-check-input c-radio-black ms-0" type="radio" name="role" id="role-1" value="admin">
                      <label class="form-check-label ms-1" for="role-1">admin</label>
                    </div>
                  </div>
                  <button type="submit" class="btn btn-success rd-btn-action border-0">
                    <i class="bi bi-check"></i> Submit
                  </button>
                </div>
              </div>
            </div>
          </form>

          <!-- Team assignment form -->
          <form action="/team/user/edit" method="POST" novalidate="novalidate">
            <input id="csrf_token_team" name="csrf_token" type="hidden" value="">
            <input type="hidden" id="role-user-id" name="user_id" value="c752937e-a181-47c6-9486-36fbc75c02a1">
            <input type="hidden" id="role-team-id" name="team_id" value="">
            <input type="hidden" id="role-team-role" name="team_role" value="">

            <div class="mb-3">
              <label class="form-label fw-bold team-toolbar">Team</label>
              <table class="table table-borderless table-hover table-sm mb-0 w-100 rd-table--white"
                id="teams-table" data-unique-id="team_id" data-toggle="table"
                data-search="true" data-toolbar=".team-toolbar"
                data-data='[{"team_id":"bd3c0513-6d7d-40ee-a2c9-25c3b0ab42df","team_name":"default","team_role":"member","member_count":8,"created_at":"2025-11-17T02:12:55.311000Z"},{"team_id":"159320b6-b244-46b1-8b9b-a32bb19528d9","team_name":"sample","team_role":"owner","member_count":6,"created_at":"2025-11-17T02:27:00.411000Z"},{"team_id":"adceede4-0923-4b2d-97af-48071c6124ed","team_name":"research","team_role":"member","member_count":4,"created_at":"2025-12-01T10:00:00.000000Z"},{"team_id":"e17e408f-396d-401b-ab9a-ff369015f36b","team_name":"platform","team_role":"member","member_count":5,"created_at":"2026-01-10T08:00:00.000000Z"}]'>
                <thead>
                  <tr>
                    <th data-sortable="true" data-field="team_role" data-formatter="teamRoleFormatter">Member Role</th>
                    <th data-sortable="true" data-field="team_name">Team Name</th>
                    <th data-field="actions" data-formatter="userTeamActionFormatter">Action</th>
                  </tr>
                </thead>
              </table>
            </div>
          </form>

          <div class="d-flex justify-content-end pt-3 border-top">
            <button type="button" class="btn btn-light rd-btn-action border-0 js-back-to-user-list">
              <i class="bi bi-x"></i> Cancel
            </button>
          </div>

        </div>
      </div>
    </main>

  </div>

  <script src="./static/js/jquery-3.7.1.min.js"></script>
  <script src="./static/js/bootstrap.bundle.min.js"></script>
  <script src="./static/js/bootstrap-table.min.js"></script>
  <script src="./static/js/app.js"></script>
</body>
</html>
