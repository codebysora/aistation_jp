<!DOCTYPE html>
<html class="h-100" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./static/css/bootstrap.min.css">
  <link rel="stylesheet" href="./static/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./static/css/style.css">
  <title>Reset Password - AIStation Dashboard</title>
</head>
<body class="h-100 rd-auth-page">
  <main class="rd-auth-shell">
    <div class="rd-auth-panel">
    <div class="card rounded-0 border-0 p-card__login rd-auth-card">
      <div class="rd-auth-card__header text-white text-center fw-bold bg-primary py-4">
        <h1 class="rd-auth-card__title fs-2 mb-1">AIStation Dashboard</h1>
        <p class="rd-auth-card__subtitle mb-0">Reset Password</p>
      </div>
      <div class="card-body p-5">
        <p class="rd-auth-card__lead text-muted small mb-4">
          Choose a new password for your account. It must be at least 8 characters.
        </p>

        <div id="password-reset-invalid" class="rd-alert rd-alert--error mb-4 rd-is-hidden">
          <div class="rd-alert__body">
            This reset link is invalid or has expired.
            <a href="./forgot_password.html" class="alert-link">Request a new reset link</a>.
          </div>
        </div>

        <div id="password-reset-success" class="rd-auth-success rd-is-hidden" role="status">
          <div class="rd-alert rd-alert--success mb-4">
            <i class="bi bi-check-circle-fill rd-alert__icon" aria-hidden="true"></i>
            <div class="rd-alert__body">Your password has been updated. You can now sign in with your new password.</div>
          </div>
          <a href="./login.html" class="btn btn-success w-100 fw-bold border-0 shadow-sm">Go to Login</a>
        </div>

        <form id="password-reset-form" action="/password/reset" method="POST" novalidate="novalidate">
          <input type="hidden" id="reset-token" name="token" value="">
          <div id="password-reset-form-error" class="rd-alert rd-alert--error mb-4 rd-is-hidden">
            <div class="rd-alert__body"></div>
          </div>
          <div class="mb-4">
            <label for="password-new" class="form-label">New password</label>
            <div class="c-form-field-password rd-auth-password">
              <input class="form-control form-control-lg" id="password-new" name="new_password" type="password" required autocomplete="new-password" minlength="8">
              <button type="button" class="c-form-field-password__toggle js-auth-password-toggle" aria-label="Show password" data-target="#password-new">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="mb-4">
            <label for="password-confirm" class="form-label">Confirm new password</label>
            <div class="c-form-field-password rd-auth-password">
              <input class="form-control form-control-lg" id="password-confirm" name="confirm_password" type="password" required autocomplete="new-password" minlength="8">
              <button type="button" class="c-form-field-password__toggle js-auth-password-toggle" aria-label="Show password" data-target="#password-confirm">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100 fw-bold border-0 shadow-sm">
            Reset Password
          </button>
        </form>
      </div>
    </div>
    <a href="./login.html" class="rd-auth-footer-link link-fade">
      <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Login
    </a>
    </div>
  </main>

  <script src="./static/js/jquery-3.7.1.min.js"></script>
  <script src="./static/js/bootstrap.bundle.min.js"></script>
  <script src="./static/js/app.js"></script>
</body>
</html>
