<!DOCTYPE html>
<html class="h-100" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./static/css/bootstrap.min.css">
  <link rel="stylesheet" href="./static/css/bootstrap-table.min.css">
  <link rel="stylesheet" href="./static/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./static/css/style.css">
  <title>AIStation Dashboard - Histories</title>
</head>
<body class="h-100">

  <!-- Header -->
  <header>
    <nav class="navbar navbar-expand-sm rd-navbar" aria-label="Top navigation">
      <a class="navbar-brand" href="./userRole_index.html">AIStation Dashboard</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a href="#" class="rd-nav-user">
              <span class="rd-nav-user__badge">User</span>
              <i class="bi bi-person-circle" aria-hidden="true"></i> takeshi.miyabe@fixstars.com
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="rd-nav-logout"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Logout</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="d-flex rd-main-container">

    <!-- Sidebar (User role) -->
    <nav class="rd-sidebar" aria-label="Main navigation">
      <ul class="nav flex-column m-0">
        <li class="rd-sidebar__section-label">User</li>
        <li class="nav-item"><a class="nav-link" href="./userRole_keys.html"><i class="bi bi-key" aria-hidden="true"></i> API Keys</a></li>
        <li class="nav-item"><a class="nav-link" href="./userRole_teams.html"><i class="bi bi-people" aria-hidden="true"></i> Teams</a></li>
        <li class="nav-item"><a class="nav-link active" href="./userRole_myhistories.html"><i class="bi bi-clock-history" aria-hidden="true"></i> Histories</a></li>
        <li class="nav-item"><a class="nav-link" href="./userRole_models.html"><i class="bi bi-robot" aria-hidden="true"></i> Models</a></li>
      </ul>
    </nav>

    <!-- Content -->
    <main class="rd-content bg-body">
      <div class="rd-card">
        <div class="rd-card__header">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item active" aria-current="page">Histories</li>
            </ol>
          </nav>
        </div>
        <div class="rd-card__body">
          <table class="table table-borderless table-hover table-striped table-sm" id="myhistories-table"
            data-unique-id="request_id" data-toggle="table"
            data-pagination="true" data-search="true"
            data-url="./static/test.json"
            data-data-field="data">
            <thead>
              <tr>
                <th data-sortable="true" data-field="status" data-formatter="historyStatusFormatter">Status</th>
                <th data-sortable="true" data-field="start_time" data-formatter="historyTimeFormatter">Time</th>
                <th data-sortable="true" data-field="model">Model</th>
                <th data-sortable="true" data-field="prompt_tokens" data-formatter="historyNumberFormatter">Prompt</th>
                <th data-sortable="true" data-field="completion_tokens" data-formatter="historyNumberFormatter">Completion</th>
                <th data-sortable="true" data-field="total_tokens" data-formatter="historyNumberFormatter">Total</th>
                <th data-sortable="true" data-field="e2el">Latency</th>
                <th data-sortable="true" data-field="request_id" data-formatter="historyRequestIdFormatter">Request ID</th>
              </tr>
            </thead>
          </table>
        </div>
      </div>
    </main>

  </div>

  <!-- History Detail Modal (user: preview only) -->
  <div class="modal fade" id="myhistory-detail-modal" tabindex="-1" aria-labelledby="myhistory-detail-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable rd-modal rd-modal--big rd-history-detail-modal">
      <div class="modal-content">
        <div class="modal-header flex-column align-items-stretch">
          <div class="d-flex align-items-start justify-content-between gap-3 w-100">
            <h5 class="modal-title text-truncate" id="myhistory-detail-modal-label">Request Detail</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div id="myhistory-detail-summary" class="d-flex flex-wrap gap-2 align-items-center mt-2"></div>
        </div>
        <div class="modal-body">
          <div id="myhistory-detail-preview"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./static/js/jquery-3.7.1.min.js"></script>
  <script src="./static/js/bootstrap.bundle.min.js"></script>
  <script src="./static/js/bootstrap-table.min.js"></script>
  <script src="./static/js/app.js"></script>
</body>
</html>
