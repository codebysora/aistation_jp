<!DOCTYPE html>
<html class="h-100" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./static/css/bootstrap.min.css">
  <link rel="stylesheet" href="./static/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./static/css/style.css">
  <title>Forgot Password - AIStation Dashboard</title>
</head>
<body class="h-100 rd-auth-page">
  <main class="rd-auth-shell">
    <div class="rd-auth-panel">
    <div class="card rounded-0 border-0 p-card__login rd-auth-card">
      <div class="rd-auth-card__header text-white text-center fw-bold bg-primary py-4">
        <h1 class="rd-auth-card__title fs-2 mb-1">AIStation Dashboard</h1>
        <p class="rd-auth-card__subtitle mb-0">Forgot Password</p>
      </div>
      <div class="card-body p-5">
        <p class="rd-auth-card__lead text-muted small mb-4">
          Enter the email address associated with your account. We will send you a link to reset your password.
        </p>

        <div id="forgot-password-success" class="rd-auth-success rd-is-hidden" role="status">
          <div class="rd-alert rd-alert--success mb-0">
            <i class="bi bi-check-circle-fill rd-alert__icon" aria-hidden="true"></i>
            <div class="rd-alert__body">
              If an account exists for that email, a password reset link has been sent. Please check your inbox.
            </div>
          </div>
        </div>

        <form id="forgot-password-form" action="/password/forgot" method="POST" novalidate="novalidate">
          <div id="forgot-password-form-error" class="rd-alert rd-alert--error mb-4 rd-is-hidden">
            <div class="rd-alert__body"></div>
          </div>
          <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input class="form-control form-control-lg js-validate-email" id="email" name="email" type="email" value="" required autocomplete="username" placeholder="you@example.com">
          </div>
          <button type="submit" class="btn btn-success w-100 fw-bold border-0 shadow-sm">
            Send Reset Link
          </button>
        </form>
      </div>
    </div>
    <a href="./login.html" class="rd-auth-footer-link link-fade">
      <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Login
    </a>
    </div>
  </main>

  <script src="./static/js/jquery-3.7.1.min.js"></script>
  <script src="./static/js/bootstrap.bundle.min.js"></script>
  <script src="./static/js/app.js"></script>
</body>
</html>
